name: IG Tags Daily Pull

on:
  schedule:
    # 14:00 UTC daily (~7am PT in DST, 6am PT in standard time). Either is fine
    # for "fresh data when Paul starts work."
    - cron: "0 14 * * *"
  workflow_dispatch: {}  # Allows manual triggering from the Actions tab

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run IG Tag Puller
        env:
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          IG_BUSINESS_ACCOUNT_ID: ${{ secrets.IG_BUSINESS_ACCOUNT_ID }}
          IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
          AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
        run: python ig_tag_puller.py
